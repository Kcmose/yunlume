name: Verify and publish yunlume releases

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release-preflight:
    name: Validate immutable release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject invalid or existing release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must use vX.Y.Z without leading zeroes: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_status="$(curl --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
          case "$release_status" in
            404) ;;
            200)
              printf 'Release already exists; refusing to overwrite: %s\n' "$RELEASE_TAG" >&2
              exit 1
              ;;
            *)
              printf 'Unable to verify release availability (HTTP %s).\n' "$release_status" >&2
              exit 1
              ;;
          esac

  frontend-test:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nav-frontend/package-lock.json
          package-manager-cache: true

      - name: Install locked frontend dependencies
        working-directory: nav-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: nav-frontend
        run: npm test

      - name: Build frontend
        working-directory: nav-frontend
        run: npm run build

      - name: Audit all frontend dependencies
        working-directory: nav-frontend
        run: npm audit --audit-level=high

      - name: Audit production frontend dependencies
        working-directory: nav-frontend
        run: npm audit --omit=dev --audit-level=high

  backend-test:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: nav-backend/pom.xml

      - name: Run backend verification
        working-directory: nav-backend
        run: mvn --batch-mode --no-transfer-progress clean verify

  publish:
    name: Publish ${{ matrix.image }} image
    needs:
      - frontend-test
      - backend-test
      - release-preflight
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: ./nav-frontend
            dockerfile: ./nav-frontend/Dockerfile
            title: yunlume frontend
            description: Static frontend and internal application gateway for yunlume
            build_args: |
              VITE_API_BASE_URL=/api
              VITE_UPLOAD_MAX_BYTES=10485760
          - image: backend
            context: ./nav-backend
            dockerfile: ./nav-backend/Dockerfile
            title: yunlume backend
            description: Spring Boot backend for yunlume
            build_args: ""
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'name=ghcr.io/%s/yunlume-%s\n' "$owner" "$COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release:
    name: Publish yunlume release assets
    needs:
      - frontend-test
      - backend-test
      - publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate immutable release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must use vX.Y.Z without leading zeroes: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nav-frontend/package-lock.json
          package-manager-cache: true

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: nav-backend/pom.xml

      - name: Build release frontend
        working-directory: nav-frontend
        run: |
          npm ci
          npm run build

      - name: Build release backend
        working-directory: nav-backend
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Assemble release assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OWNER: ${{ steps.release.outputs.owner }}
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          set -Eeuo pipefail
          install -d -m 0755 release
          chmod +x ops/package-host-release.sh
          OUTPUT_DIR=release ops/package-host-release.sh "$VERSION"
          install -m 0644 docker-compose.yml release/yunlume-compose.yml

          python3 - "$RELEASE_BASE_URL" <<'PY'
          import sys
          from pathlib import Path

          placeholder = "__YUNLUME_RELEASE_BASE_URL__"
          source = Path("install.sh").read_text(encoding="utf-8")
          if source.count(placeholder) != 1:
              raise SystemExit("install.sh must contain exactly one release URL placeholder")
          rendered = source.replace(placeholder, sys.argv[1])
          Path("release/install.sh").write_text(rendered, encoding="utf-8", newline="\n")
          PY
          chmod 0755 release/install.sh
          bash -n release/install.sh
          if grep -Fq '__YUNLUME_RELEASE_BASE_URL__' release/install.sh; then
            printf 'Rendered installer still contains the release URL placeholder.\n' >&2
            exit 1
          fi

          compose_sha="$(sha256sum release/yunlume-compose.yml | awk '{print $1}')"
          archive_name="yunlume-host-v${VERSION}.tar.gz"
          archive_sha="$(sha256sum "release/$archive_name" | awk '{print $1}')"
          python3 - "$VERSION" "$OWNER" "$compose_sha" "$archive_name" "$archive_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, owner, compose_sha, archive_name, archive_sha = sys.argv[1:]
          manifest = {
              "version": version,
              "docker": {
                  "compose": "yunlume-compose.yml",
                  "composeSha256": compose_sha,
                  "backendImage": f"ghcr.io/{owner}/yunlume-backend:{version}",
                  "frontendImage": f"ghcr.io/{owner}/yunlume-frontend:{version}",
              },
              "host": {
                  "archive": archive_name,
                  "archiveSha256": archive_sha,
              },
          }
          Path("release/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

          (
            cd release
            sha256sum \
              install.sh \
              release-manifest.json \
              yunlume-compose.yml \
              "$archive_name" \
              "$archive_name.sha256" > SHA256SUMS
            sha256sum --check --quiet --strict "$archive_name.sha256"
            sha256sum --check --quiet --strict SHA256SUMS
          )

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive_name="yunlume-host-v${VERSION}.tar.gz"
          gh release create "$RELEASE_TAG" \
            release/install.sh \
            release/yunlume-compose.yml \
            release/release-manifest.json \
            "release/$archive_name" \
            "release/$archive_name.sha256" \
            release/SHA256SUMS \
            --verify-tag \
            --latest \
            --title "yunlume $RELEASE_TAG" \
            --generate-notes
