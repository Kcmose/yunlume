upstream yunlume_backend {
    server 127.0.0.1:18081;
    keepalive 16;
}

map $http_upgrade $yunlume_connection_upgrade {
    default upgrade;
    '' close;
}

# realip_remote_addr 保留直属连接来源，不能让转发客户端 IP 改变代理信任判断。
geo $realip_remote_addr $yunlume_proxy_peer_trusted {
    default 0;
    __HOST_TRUSTED_PROXY_CIDR__ 1;
}

map "__HOST_TRUST_PROXY_HEADERS__:$yunlume_proxy_peer_trusted:$http_x_forwarded_proto" $yunlume_forwarded_proto {
    default $scheme;
    ~*^true:1:https$ https;
    ~*^true:1:http$ http;
}

# 仅对应请求方法消耗限流预算，OPTIONS 不占用登录和安装额度。
map $request_method $yunlume_login_limit_key {
    default "";
    POST $binary_remote_addr;
}

map $request_method $yunlume_install_limit_key {
    default "";
    POST $binary_remote_addr;
}

map $request_method $yunlume_database_install_limit_key {
    default "";
    POST $binary_remote_addr;
}

map $request_method $yunlume_redis_install_limit_key {
    default "";
    POST $binary_remote_addr;
}

map $request_method $yunlume_install_status_limit_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}

map $request_method $yunlume_health_limit_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}

limit_req_zone $yunlume_login_limit_key zone=yunlume_login_per_ip:10m rate=5r/m;
limit_req_zone $yunlume_install_limit_key zone=yunlume_install_per_ip:10m rate=3r/m;
limit_req_zone $yunlume_database_install_limit_key zone=yunlume_database_install_per_ip:10m rate=3r/m;
limit_req_zone $yunlume_redis_install_limit_key zone=yunlume_redis_install_per_ip:10m rate=3r/m;
limit_req_zone $yunlume_install_status_limit_key zone=yunlume_install_status_per_ip:10m rate=30r/m;
limit_req_zone $yunlume_health_limit_key zone=yunlume_health_per_ip:10m rate=60r/m;

server {
    listen __HOST_LISTEN_ADDRESS__:__APP_PORT__;
    server_name _;

    set_real_ip_from __HOST_EFFECTIVE_TRUSTED_PROXY__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root __INSTALL_DIR__/current/frontend;
    index index.html;
    server_tokens off;
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /api/health {
        client_max_body_size 1k;
        limit_req zone=yunlume_health_per_ip burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/admin/auth/login {
        client_max_body_size 32k;
        limit_req zone=yunlume_login_per_ip burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/status {
        client_max_body_size 1k;
        limit_req zone=yunlume_install_status_per_ip burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/check {
        client_max_body_size 32k;
        limit_req zone=yunlume_install_per_ip burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/database/test {
        client_max_body_size 96k;
        client_body_buffer_size 96k;
        access_log off;
        limit_req zone=yunlume_database_install_per_ip burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/database/configure {
        client_max_body_size 32k;
        client_body_buffer_size 32k;
        access_log off;
        limit_req zone=yunlume_database_install_per_ip burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/redis/test {
        client_max_body_size 96k;
        client_body_buffer_size 96k;
        access_log off;
        limit_req zone=yunlume_redis_install_per_ip burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 80s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/redis/configure {
        client_max_body_size 32k;
        client_body_buffer_size 32k;
        access_log off;
        limit_req zone=yunlume_redis_install_per_ip burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/install/complete {
        client_max_body_size 32k;
        limit_req zone=yunlume_install_per_ip burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @yunlume_rate_limited;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location @yunlume_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后重试","data":null}';
    }

    location = /api/admin/data/import/preview {
        client_max_body_size 66m;
        error_page 413 = @yunlume_data_package_too_large;

        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location @yunlume_data_package_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 413 '{"code":413,"message":"数据包不能超过 64MiB","data":null}';
    }

    location = /api {
        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        client_max_body_size 12m;
        proxy_pass http://yunlume_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $yunlume_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $yunlume_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /var/lib/yunlume/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
